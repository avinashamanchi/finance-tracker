name: Finova Release Readiness (No Build, Deploy, or Submit)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node 22.23.2
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install exact mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Run behavioral and static gates
        working-directory: mobile
        run: |
          npm test -- --runInBand
          npm run typecheck
          npm run lint
          npm run expo:doctor
          npm run export:ios
          npm audit --audit-level=high
      - name: Generate native iOS project without credentials
        working-directory: mobile
        run: npx expo prebuild --platform ios --no-install --clean
      - name: Verify native generation is manifest-stable
        working-directory: mobile
        run: git diff --exit-code -- package.json package-lock.json
      - name: Parse workflow YAML
        run: ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].each { |file| YAML.load_file(file); puts file }'
      - name: Verify opaque icon dimensions
        run: |
          test "$(sips -g pixelWidth mobile/assets/icon.png | awk '/pixelWidth/{print $2}')" = "1024"
          test "$(sips -g pixelHeight mobile/assets/icon.png | awk '/pixelHeight/{print $2}')" = "1024"
          test "$(sips -g hasAlpha mobile/assets/icon.png | awk '/hasAlpha/{print $2}')" = "no"
      - name: Run redacted source and bundle scan
        run: node scripts/scan-secrets.mjs --tracked --paths mobile/dist
      - name: Record content-free readiness result
        run: node -e 'require("node:fs").writeFileSync("finova-readiness.txt", `sha=${process.env.GITHUB_SHA}\nlocal_gates=passed\nbuilt=false\ndeployed=false\nsubmitted=false\n`)'
      - name: Upload content-free readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: finova-readiness-${{ github.sha }}
          path: finova-readiness.txt
          if-no-files-found: error
          retention-days: 14

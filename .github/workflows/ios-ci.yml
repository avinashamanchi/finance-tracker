name: Finova iOS CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node 22.23.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Verify static landing behavior
        run: node scripts/test-public-landing.mjs
      - name: Install exact mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Test mobile behavior
        working-directory: mobile
        run: npm test -- --runInBand
      - name: Enforce 100k ledger and bounded UI gates
        working-directory: mobile
        run: npm run test:scale
      - name: Assert supported surface
        working-directory: mobile
        run: npm test -- --runInBand __tests__/legacyWebQuarantine.test.ts
      - name: Type-check mobile app
        working-directory: mobile
        run: npm run typecheck
      - name: Lint mobile app
        working-directory: mobile
        run: npm run lint
      - name: Check Expo dependencies
        working-directory: mobile
        run: npm run expo:doctor
      - name: Export production iOS bundle
        working-directory: mobile
        run: npm run export:ios
      - name: Audit mobile dependencies
        run: node scripts/check-mobile-audit.mjs
      - name: Run redacted source and bundle scan
        run: node scripts/scan-secrets.mjs --tracked --paths mobile/dist

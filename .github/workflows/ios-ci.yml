name: Finova iOS CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node 22.23.2
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install exact mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Test mobile behavior
        working-directory: mobile
        run: npm test -- --runInBand
      - name: Type-check mobile app
        working-directory: mobile
        run: npm run typecheck
      - name: Lint mobile app
        working-directory: mobile
        run: npm run lint
      - name: Check Expo dependencies
        working-directory: mobile
        run: npm run expo:doctor
      - name: Export production iOS bundle
        working-directory: mobile
        run: npm run export:ios
      - name: Audit mobile dependencies
        working-directory: mobile
        run: npm audit --audit-level=high
      - name: Run redacted source and bundle scan
        run: node scripts/scan-secrets.mjs --tracked --paths mobile/dist
